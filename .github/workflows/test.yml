name: Test CKAN Status

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc

      - name: Run tests
        run: pnpm test
